name: pawpass
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.5+11

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: any
  supabase_flutter: any
  go_router: any
  riverpod: any
  flutter_riverpod: any
  riverpod_annotation: any
  image_picker: any
  file_picker: any
  cached_network_image: any
  shimmer: any
  intl: any
  flutter_local_notifications: any
  in_app_purchase: any
  url_launcher: any
  share_plus: any
  flutter_svg: any
  lottie: any
  shared_preferences: any
  path_provider: any
  flutter_dotenv: any
  fl_chart: any
  timezone: any
  pdf: any
  printing: any
  google_sign_in: any
  http: any
  dio: ^5.9.2
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  riverpod_generator: any
  custom_lint: any
  riverpod_lint: any

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/
  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
